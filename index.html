<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mbedüm Ndakaru</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cabin:wght@600;700&family=Poppins:wght@300;400&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100svh;
    display: grid;
    place-items: center;
    padding: 32px 22px;
    background: #14181a;
    color: #fff;
    font-family: "Poppins", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    text-align: center;
    -webkit-font-smoothing: antialiased;
  }
  .bloc { display: grid; gap: 20px; justify-items: center; max-width: 460px; }
  .logo {
    font-family: "Cabin", "Poppins", Arial, sans-serif;
    font-size: clamp(19px, 5.6vw, 25px);
    font-weight: 700;
    letter-spacing: .02em;
  }
  .rule { width: 42px; height: 2px; background: #fff; opacity: .8; }
  p {
    margin: 0;
    font-size: clamp(14.5px, 4vw, 16px);
    font-weight: 300;
    line-height: 1.7;
    color: rgba(255, 255, 255, .8);
  }
</style>
</head>
<body>
  <main class="bloc">
    <div class="logo">Mbedüm Ndakaru</div>
    <span class="rule"></span>
    <p>Le site est momentanément indisponible.</p>
  </main>
</body>
</html>
